version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: meetmind-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: meetmind
      MYSQL_USER: meetmind
      MYSQL_PASSWORD: meetmind
    ports:
      - '3306:3306'
    volumes:
      - meetmind_mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-u', 'root', '-proot']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  meetmind_mysql_data:
